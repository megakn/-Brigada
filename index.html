<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atendimento Brigada KN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ficha de atendimento em coluna única à esquerda + registro do dia à direita (empilha no celular) */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b1f26; --muted:#5f6673; --line:#dde0e6;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe9ec;
  --ok:#1f7a4d; --ok-soft:#e5f3ec; --warn:#a65f00; --warn-soft:#fdf1df;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1c2027; --ink:#eceef2; --muted:#9aa1ad; --line:#2e333c;
  --accent:#ff4d5e; --accent-ink:#1a0005; --accent-soft:#3a1a20;
  --ok:#5fd09a; --ok-soft:#173327; --warn:#f2b14f; --warn-soft:#3a2b14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1c2027; --ink:#eceef2; --muted:#9aa1ad; --line:#2e333c;
  --accent:#ff4d5e; --accent-ink:#1a0005; --accent-soft:#3a1a20;
  --ok:#5fd09a; --ok-soft:#173327; --warn:#f2b14f; --warn-soft:#3a2b14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.cfgp{padding-block:8px}
.cfg-head{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;font-family:var(--f-display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;padding:2px 0}
.cfg-head:focus-visible{outline:3px solid var(--accent-soft)}
.seta{display:inline-block;transition:transform .15s;color:var(--muted)}
.cfgp.aberto .seta{transform:rotate(90deg)}
.cfg-st{margin-left:auto;font-family:var(--f-body);font-size:.75rem;font-weight:600;text-transform:none;letter-spacing:0}
.cfg-st.ok{color:var(--ok)}.cfg-st.no{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 30px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cross{width:34px;height:34px;transform-origin:0 0;flex:none;background:var(--accent);border-radius:10px;position:relative}
.cross::before,.cross::after{content:"";position:absolute;background:var(--accent-ink);border-radius:2px}
.cross::before{left:14px;top:7px;width:6px;height:20px}.cross::after{left:7px;top:14px;width:20px;height:6px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.05;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:1px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.02rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
form{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,.8fr);gap:8px}
.row2>div,.row3>div{min-width:0}
@media (max-width:460px){.row3{grid-template-columns:1fr 1fr}.row3>div:first-child{grid-column:1/-1}}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.78rem;margin-bottom:3px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.req{color:var(--accent);margin-left:2px}
input,select,textarea{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:34px}
textarea{min-height:52px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.invalid{border-color:var(--accent)!important}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.combo{position:relative}
.list{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.opt{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt:hover,.opt.act{background:var(--accent-soft)}
.opt small{color:var(--muted);font-family:var(--f-mono);font-size:.75rem;white-space:nowrap}
.ccard{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.ccard .k{color:var(--muted)}
.hist{flex-basis:100%;font-weight:600}
.hist.n1{color:var(--ok)}.hist.n2{color:var(--warn)}.hist.n3{color:var(--accent)}
.vez{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
.vez.alto{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.vez.medio{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.top{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:.85rem}
.top b.tt{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.top ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.top li button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:2px 4px;border-radius:5px;box-sizing:border-box}
.top li button:hover,.top li button:focus-visible{background:var(--accent-soft)}
.top .q{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem}
.card dt{color:var(--muted)}.card dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer;color:var(--ink);font:inherit;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{font:inherit;font-size:.88rem;font-weight:600;border-radius:7px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:.98rem;letter-spacing:.03em;text-transform:uppercase}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{padding:10px 14px;border-radius:8px;font-weight:600;font-size:.92rem}
.toast.ok{background:var(--ok-soft);color:var(--ok)}.toast.err{background:var(--accent-soft);color:var(--accent)}.toast.warn{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.tools > div{flex:1 1 140px;min-width:0}
.stat{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.stat b{color:var(--ink);font-family:var(--f-mono)}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--bg);display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.rec.c-hosp{border-left-color:var(--accent)}.rec.c-casa,.rec.c-amb{border-left-color:var(--warn)}.rec.c-ok{border-left-color:var(--ok)}
.rec-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rec-name{font-weight:600}
.rec-time{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.rec-meta{font-size:.85rem;color:var(--muted)}
.rec-txt{font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.pill.c-hosp{background:var(--accent-soft);color:var(--accent)}.pill.c-casa,.pill.c-amb{background:var(--warn-soft);color:var(--warn)}.pill.c-ok{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:8px}
.del{font:inherit;font-size:.8rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.confirm{display:flex;gap:8px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.qrcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.qrimg{background:#fff;padding:10px;border-radius:8px;border:1px solid var(--line);line-height:0}
.qrimg img,.qrimg canvas{width:170px;height:170px}
.qrtxt{flex:1 1 180px;min-width:0}
.qrtxt p{margin:4px 0 8px;font-size:.92rem}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.qrpanel{display:flex;flex-direction:column;align-items:center;gap:10px}
#qrCartaz{width:220px;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
#printArea{display:none}
@media print{
  body{background:#fff!important;padding:0!important}
  body.imprimindo > *:not(#printArea){display:none!important}
  body.imprimindo #printArea{display:flex!important;flex-wrap:wrap;justify-content:center;gap:10mm;padding-top:10mm}
  #printArea img{width:120mm;max-width:100%;height:auto;break-inside:avoid}
  #printArea.dois img{width:88mm}
  @page{size:A4;margin:12mm}
}
.url{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.scanrow{display:flex;gap:8px}
.scanrow .combo{flex:1;min-width:0}
.scanbtn{flex:none;padding:6px 10px}
#cam{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head><body>

<div id="printArea"></div>
<div class="wrap">
  <header>
    <div class="cross" aria-hidden="true"></div>
    <div>
      <h1>Ficha de Atendimento — Brigada</h1>
      <p class="sub">Kuehne+Nagel · Operação Meli · registro de primeiros socorros</p>
    </div>
    
  </header>


  <section class="panel cfgp" id="cfgBox">
    <button type="button" class="cfg-head" id="cfgToggle" aria-expanded="false" aria-controls="cfg">
      <span class="seta" aria-hidden="true">▸</span> Ligar à planilha <span class="cfg-st" id="cfgSt"></span>
    </button>
    <div id="cfg" hidden>
      <label for="cfgUrl" style="margin-top:10px">Link do App da Web do Apps Script (termina em /exec)</label>
      <input id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" style="font-family:var(--f-mono);font-size:.8rem">
      <div class="hint">Fica salvo neste aparelho. Para valer em todos, coloque o link na linha SCRIPT_URL do arquivo.</div>
      <div class="actions" style="margin-top:8px"><button class="btn primary" id="cfgSave" type="button">Salvar link</button></div>
    </div>
  </section>

  <div class="grid">
    <div class="col">
    <section class="panel" aria-labelledby="t-form">
      <h2 id="t-form">Novo atendimento</h2>
      <form id="f" novalidate>
        <div class="row3">
          <div><label for="brig">Brigadista<span class="req">*</span></label><input id="brig" autocomplete="name" placeholder="Seu nome"></div>
          <div><label for="data">Data<span class="req">*</span></label><input id="data" type="date"></div>
          <div><label for="hora">Hora<span class="req">*</span></label><input id="hora" type="time"></div>
        </div>

        <div>
          <label for="busca">Colaborador<span class="req">*</span></label>
          <div class="scanrow">
            <div class="combo">
              <input id="busca" autocomplete="off" placeholder="Nome ou ID…" role="combobox" aria-expanded="false" aria-controls="lst">
              <div class="list" id="lst" role="listbox" hidden></div>
            </div>
            <button class="btn scanbtn" id="scanBtn" type="button" title="Ler QR / código de barras do crachá">📷 Crachá</button>
          </div>
          <div id="cam" hidden><div id="reader"></div></div>
          <div class="ccard" id="card" hidden>
            <span><span class="k">ID</span> <b class="mono" id="cId"></b></span>
            <span><span class="k">Tel</span> <b class="mono" id="cTel"></b></span>
            <span><span class="k">HRS</span> <b id="cHrs"></b></span>
            <span class="hist" id="cHist"></span>
          </div>
        </div>

        <div class="row2">
          <div><label for="local">Local / setor</label><input id="local" placeholder="Rua 4, Sorting…"></div>
          <div><label for="dest">Encaminhamento</label>
            <select id="dest">
              <option value="ok">Retornou ao trabalho</option>
              <option value="amb">Ambulatório</option>
              <option value="casa">Liberado para casa</option>
              <option value="hosp">Hospital / SAMU</option>
            </select>
          </div>
        </div>

        <div><label for="relato">O que está sentindo<span class="req">*</span></label><textarea id="relato" rows="2" placeholder="Onde dói, desde quando, o que estava fazendo…"></textarea></div>
        <div><label for="conduta">Conduta</label><input id="conduta" placeholder="Ex.: aferida pressão, repouso 15 min"></div>

        <div id="msg" hidden></div>
        <div class="actions">
          <button class="btn primary" id="salvar" type="submit">Registrar</button>
          <button class="btn" id="limpar" type="button">Limpar</button>
        </div>
      </form>
    </section>

const DEST={ok:'Retornou ao trabalho',amb:'Ambulatório',casa:'Liberado para casa',hosp:'Hospital / SAMU'};
function norm(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function fmtTel(d){if(!d)return '—';if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return d}
function pad(n){return String(n).padStart(2,'0')}
function hoje(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function agora(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function brData(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let sel=null, dest='ok', recs=[], act=-1;
try{$('brig').value=localStorage.getItem('brig')||''}catch(e){}
$('data').value=hoje();$('hora').value=agora();$('fData').value=hoje();

/* ---- busca de colaborador ---- */
const busca=$('busca'),lst=$('lst');
function renderList(){
  const q=norm(busca.value.trim());
  let hits=q?EMP.filter(e=>q.split(/\s+/).every(p=>e.k.includes(p))).slice(0,40):[];
  let html=hits.map((e,i)=>`<div class="opt${i===act?' act':''}" role="option" data-i="${EMP.indexOf(e)}"><span>${esc(e.nome)}</span><small>${esc(e.id||'sem ID')}</small></div>`).join('');
  if(q && busca.value.trim().length>=3) html+=`<div class="opt" role="option" data-manual="1"><span>Usar nome digitado: <b>${esc(busca.value.trim())}</b></span><small>fora da lista</small></div>`;
  lst.innerHTML=html;lst.hidden=!html;busca.setAttribute('aria-expanded',String(!!html));
}
function pick(e){
  sel=e;busca.value=e.nome;lst.hidden=true;busca.classList.remove('invalid');
  $('cId').textContent=e.id||'—';$('cTel').textContent=fmtTel(e.tel);$('cHrs').textContent=e.hrs||'—';mostrarHist();
  $('card').hidden=false;
}
busca.addEventListener('input',()=>{sel=null;$('card').hidden=true;act=-1;renderList()});
busca.addEventListener('focus',renderList);
busca.addEventListener('keydown',ev=>{
  const opts=[...lst.querySelectorAll('.opt')];if(lst.hidden||!opts.length)return;
  if(ev.key==='ArrowDown'){act=Math.min(act+1,opts.length-1);ev.preventDefault()}
  else if(ev.key==='ArrowUp'){act=Math.max(act-1,0);ev.preventDefault()}
  else if(ev.key==='Enter'&&act>=0){ev.preventDefault();opts[act].click();return}
  else if(ev.key==='Escape'){lst.hidden=true;return}else return;
  opts.forEach((o,i)=>o.classList.toggle('act',i===act));opts[act]?.scrollIntoView({block:'nearest'});
});
lst.addEventListener('mousedown',ev=>ev.preventDefault());
lst.addEventListener('click',ev=>{
  const o=ev.target.closest('.opt');if(!o)return;
  if(o.dataset.manual)pick({id:'',nome:busca.value.trim(),tel:'',hrs:'',manual:true});
  else pick(EMP[+o.dataset.i]);
});
busca.addEventListener('blur',()=>setTimeout(()=>lst.hidden=true,120));

/* ---- encaminhamento ---- */
$('dest').addEventListener('change',()=>{dest=$('dest').value});

function msg(t,cls){const m=$('msg');m.className='toast '+cls;m.textContent=t;m.hidden=false;clearTimeout(msg.t);msg.t=setTimeout(()=>m.hidden=true,6000)}
function limpar(keepBrig=true){
  sel=null;busca.value='';$('card').hidden=true;$('local').value='';$('relato').value='';$('conduta').value='';
  $('data').value=hoje();$('hora').value=agora();
  dest='ok';$('dest').value='ok';
  document.querySelectorAll('.invalid').forEach(e=>e.classList.remove('invalid'));
}
$('limpar').addEventListener('click',()=>limpar());

$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const req=[['brig',$('brig').value.trim()],['data',$('data').value],['hora',$('hora').value],['busca',sel],['relato',$('relato').value.trim()]];
  let falta=[];req.forEach(([id,v])=>{const bad=!v;$(id).classList.toggle('invalid',bad);if(bad)falta.push(id)});
  if(falta.length){const nomes={brig:'brigadista',data:'data',hora:'horário',busca:'colaborador (escolha na lista)',relato:'relato'};msg('Preencha: '+falta.map(f=>nomes[f]).join(', ')+'.','err');$(falta[0]).focus();return}
  if(!getUrl()){msg('Configure o link da planilha (botão ⚙ Planilha no topo) antes de registrar.','err');return}
  const doc={
    brigadista:$('brig').value.trim(),data:$('data').value,hora:$('hora').value,
    colabId:sel.id||'',colabNome:sel.nome,colabTel:sel.tel||'',hrs:sel.hrs||'',foraDaLista:!!sel.manual,
    local:$('local').value.trim(),relato:$('relato').value.trim(),conduta:$('conduta').value.trim(),
    encaminhamento:dest,criadoEm:new Date().toISOString()
  };
  try{localStorage.setItem('brig',doc.brigadista)}catch(e){}
  const btn=$('salvar');btn.disabled=true;btn.textContent='Registrando…';
  try{
    const r=await fetch(getUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:'salvar',...doc})});
    const j=await r.json();if(!j.ok)throw new Error(j.erro||'falha');
    msg(`Atendimento de ${doc.colabNome} gravado na planilha às ${doc.hora}.`,'ok');limpar();$('fData').value=doc.data;carregar();
  }catch(e){msg('Não foi possível gravar na planilha ('+(e.message||'sem conexão')+'). Confira a internet e o link da planilha e tente de novo.','err')}
  finally{btn.disabled=false;btn.textContent='Registrar atendimento'}
});

/* ---- contagem por colaborador ---- */
const chave=r=>r.colabId?('id:'+r.colabId):('n:'+norm(r.colabNome||r.nome));
let CONT={};
function contar(){
  CONT={};
  recs.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).forEach(r=>{const k=chave(r);(CONT[k]=CONT[k]||[]).push(r);r._n=CONT[k].length});
}
function mostrarHist(){
  const h=$('cHist');if(!sel){h.textContent='';return}
  const l=CONT[chave({colabId:sel.id,colabNome:sel.nome})]||[];
  if(!l.length){h.className='hist n1';h.textContent='Primeiro atendimento registrado.';return}
  const u=l[l.length-1];
  h.className='hist '+(l.length>=3?'n3':'n2');
  h.textContent=`Já teve ${l.length} atendimento${l.length>1?'s':''} · último em ${brData(u.data)} (${(u.relato||'').slice(0,40)}${(u.relato||'').length>40?'…':''})`;
}
function desenharTop(){
  const box=$('top'),lista=Object.values(CONT).filter(l=>l.length>=2).sort((a,b)=>b.length-a.length).slice(0,5);
  if(!lista.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML='<b class="tt">Mais atendidos (total)</b><ol>'+lista.map(l=>{const r=l[l.length-1];return `<li><button type="button" data-nome="${esc(r.colabNome)}"><span>${esc(r.colabNome)}${r.hrs?` <span class="rec-time">· ${esc(r.hrs)}</span>`:''}</span><span class="q">${l.length}×</span></button></li>`}).join('')+'</ol>';
}
$('top').addEventListener('click',ev=>{const b=ev.target.closest('[data-nome]');if(!b)return;$('fData').value='';$('fTxt').value=b.dataset.nome;render()});

/* ---- planilha ---- */
function getUrl(){let u='';try{u=localStorage.getItem('brigUrl')||''}catch(e){}return u||SCRIPT_URL}
function abrirCfg(abre){$('cfg').hidden=!abre;$('cfgToggle').setAttribute('aria-expanded',String(abre));$('cfgBox').classList.toggle('aberto',abre);if(abre)$('cfgUrl').value=getUrl()}
function statusCfg(){const ok=!!getUrl();$('cfgSt').textContent=ok?'● ligada':'● não ligada';$('cfgSt').className='cfg-st '+(ok?'ok':'no')}
$('cfgToggle').addEventListener('click',()=>abrirCfg($('cfg').hidden));statusCfg();
$('cfgSave').addEventListener('click',()=>{const u=$('cfgUrl').value.trim();try{localStorage.setItem('brigUrl',u)}catch(e){}abrirCfg(false);statusCfg();msg('Link da planilha salvo.','ok');carregar()});

async function carregar(){
  const sync=$('sync');
  if(!getUrl()){$('recs').innerHTML='<div class="empty">Planilha ainda não ligada. Abra “Ligar à planilha” e cole o link do Apps Script.</div>';$('stat').textContent='';abrirCfg(true);return}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(getUrl()+'?acao=listar',{signal:ctl.signal});const j=await r.json();
    if(!j.ok)throw new Error(j.erro||'falha');recs=j.dados||[];contar();sync.hidden=true;render();mostrarHist();
  }catch(e){sync.className='toast warn';sync.textContent='Não consegui ler a planilha agora ('+(e.name==='AbortError'?'tempo esgotado':e.message)+'). Os envios continuam funcionando quando a conexão voltar.';sync.hidden=false;render()}
  finally{clearTimeout(t)}
}

function filtrados(){
  const d=$('fData').value,q=norm($('fTxt').value.trim());
  return recs.filter(r=>(!d||r.data===d)&&(!q||norm([r.colabNome,r.colabId,r.brigadista,r.hrs,r.local,r.relato].join(' ')).includes(q)))
    .sort((a,b)=>(b.data+b.hora).localeCompare(a.data+a.hora));
}
function render(){
  desenharTop();
  const f=filtrados(),box=$('recs');
  const hosp=f.filter(r=>r.encaminhamento==='hosp').length;
  const pessoas=new Set(f.map(chave)).size;
  $('stat').innerHTML=`<b>${f.length}</b> atendimento${f.length===1?'':'s'} · <b>${pessoas}</b> colaborador${pessoas===1?'':'es'}${$('fData').value?' em '+brData($('fData').value):' no total'}${hosp?` · <b>${hosp}</b> encaminhado${hosp>1?'s':''} ao hospital`:''}`;
  if(!f.length){box.innerHTML=`<div class="empty">${recs.length?'Nenhum atendimento com esse filtro.':'Nenhum atendimento registrado ainda. O primeiro que você salvar aparece aqui e na planilha.'}</div>`;return}
  box.innerHTML=f.map(r=>`<article class="rec c-${esc(r.encaminhamento)}">
    <div class="rec-top"><span class="rec-name">${esc(r.colabNome)}${r.colabId?` <span class="mono rec-time">#${esc(r.colabId)}</span>`:''}${r._n?`<span class="vez ${r._n>=3?'alto':r._n===2?'medio':''}" title="${(CONT[chave(r)]||[]).length} atendimento(s) no total">${r._n}º atend.</span>`:''}</span><span class="rec-time">${esc(brData(r.data))} · ${esc(r.hora)}</span></div>
    <div><span class="pill c-${esc(r.encaminhamento)}">${esc(DEST[r.encaminhamento]||r.encaminhamento)}</span></div>
    <div class="rec-txt">${esc(r.relato)}</div>
    ${r.conduta?`<div class="rec-meta"><b>Conduta:</b> ${esc(r.conduta)}</div>`:''}
    <div class="rec-meta">Brigadista: ${esc(r.brigadista)}${r.local?' · Local: '+esc(r.local):''}${r.hrs?' · HRS: '+esc(r.hrs):''}${r.colabTel?' · Tel: '+esc(fmtTel(r.colabTel)):''}</div>
  </article>`).join('');
}
$('fData').addEventListener('input',render);$('fTxt').addEventListener('input',render);$('atu').addEventListener('click',carregar);

function csvCell(v){v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('exp').addEventListener('click',()=>{
  const f=filtrados();if(!f.length){msg('Não há atendimentos para exportar com esse filtro.','warn');return}
  const head=['Data','Horário','ID','Colaborador','Telefone','HRS','Local','Relato','Conduta','Encaminhamento','Brigadista','Nº do atendimento','Total do colaborador'];
  const lines=[head.join(';')].concat(f.map(r=>[brData(r.data),r.hora,r.colabId,r.colabNome,fmtTel(r.colabTel),r.hrs,r.local,r.relato,r.conduta,DEST[r.encaminhamento]||'',r.brigadista,r._n||'',(CONT[chave(r)]||[]).length].map(csvCell).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`atendimentos-brigada-${$('fData').value||'todos'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
/* ---- QR Code do Forms ---- */
const FORMS_URL='https://docs.google.com/forms/d/e/1FAIpQLSf86_4xf5E4mTN3D58xL3a2HWHtk13ktRt4dVoNmxSyX3_dSA/viewform';
$('qrPrint').addEventListener('click',()=>{
  const src=$('qrCartaz').src;if(!src)return;
  const pa=$('printArea');pa.innerHTML='';const i=new Image();i.src=src;pa.appendChild(i);
  document.body.classList.add('imprimindo');
  (i.decode?i.decode().catch(()=>{}):Promise.resolve()).then(()=>{window.print();setTimeout(()=>document.body.classList.remove('imprimindo'),500)});
});
window.addEventListener('afterprint',()=>document.body.classList.remove('imprimindo'));

/* ---- leitura do crachá ---- */
let scanner=null;
async function pararScan(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}$('cam').hidden=true;$('scanBtn').textContent='📷 Ler crachá'}
function achar(code){
  const raw=String(code).trim(),dig=raw.replace(/\D/g,'');
  return EMP.find(e=>e.id&&(e.id===raw||e.id===dig||(dig.length>4&&dig.endsWith(e.id)&&e.id.length>=5)))
      || EMP.find(e=>norm(e.nome)===norm(raw));
}
$('scanBtn').addEventListener('click',async()=>{
  if(scanner){pararScan();return}
  if(!window.Html5Qrcode){msg('Não carregou o leitor de câmera. Verifique a internet.','err');return}
  $('cam').hidden=false;$('scanBtn').textContent='✕ Fechar câmera';
  scanner=new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},async txt=>{
      const e=achar(txt);
      if(e){await pararScan();pick(e);msg('Crachá lido: '+e.nome,'ok');if(navigator.vibrate)navigator.vibrate(80)}
      else{msg('Código lido ('+txt+') não está na lista. Busque pelo nome.','warn')}
    });
  }catch(err){await pararScan();msg('Não foi possível abrir a câmera. Libere a permissão de câmera no navegador e abra o formulário por link https.','err')}
});

carregar();
</script>
